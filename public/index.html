<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Calculator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 360px;
      margin: 0 auto;
      padding: 1.25rem 1rem;
      background: #1a1b26;
      color: #c0caf5;
      min-height: 100vh;
    }
    .calc {
      background: #24283b;
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .calc-badge {
      font-size: 0.7rem;
      color: #565f89;
      margin: 0 0 0.5rem 0;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .display-wrap {
      background: #16161e;
      border-radius: 10px;
      padding: 0.75rem 1.25rem 1rem;
      margin-bottom: 1.25rem;
      min-height: 56px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 0.25rem;
    }
    .pending-line {
      font-size: 0.85rem;
      font-weight: 500;
      color: #565f89;
      min-height: 1.25em;
      text-align: right;
      width: 100%;
    }
    .display {
      font-size: 1.875rem;
      font-weight: 500;
      color: #c0caf5;
      word-break: break-all;
      text-align: right;
      min-height: 1.5em;
      letter-spacing: 0.02em;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 0.5rem;
    }
    .key {
      min-height: 52px;
      border: none;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.05s, background 0.15s;
    }
    .key:not(.key-zero):not(.key-eq) {
      aspect-ratio: 1;
    }
    .key:active {
      transform: scale(0.96);
    }
    .key-num {
      background: #414868;
      color: #c0caf5;
    }
    .key-num:hover {
      background: #565f89;
    }
    .key-op {
      background: #7aa2f7;
      color: #1a1b26;
    }
    .key-op:hover {
      background: #89b4fa;
    }
    .key-eq {
      background: #9ece6a;
      color: #1a1b26;
      grid-row: span 2;
      min-height: 0;
    }
    .key-eq:hover {
      background: #b9f27c;
    }
    .key-clear {
      background: #f7768e;
      color: #1a1b26;
    }
    .key-clear:hover {
      background: #ff9e9e;
    }
    .key-zero {
      grid-column: span 2;
      aspect-ratio: auto;
      min-height: 52px;
    }
  </style>
</head>
<body>
  <div class="calc">
    <p class="calc-badge" aria-hidden="true">1×1=2 · Balanced equation</p>
    <div class="display-wrap">
      <div class="pending-line" id="pendingLine" aria-hidden="true"></div>
      <div class="display" id="display" aria-live="polite">0</div>
    </div>
    <div class="keypad">
      <button type="button" class="key key-clear" id="keyC" aria-label="Clear">C</button>
      <button type="button" class="key key-op" id="keyDiv" aria-label="Divide">÷</button>
      <button type="button" class="key key-op" id="keyMul" aria-label="Multiply">×</button>
      <button type="button" class="key key-op" id="keySub" aria-label="Subtract">−</button>
      <button type="button" class="key key-num" data-num="7">7</button>
      <button type="button" class="key key-num" data-num="8">8</button>
      <button type="button" class="key key-num" data-num="9">9</button>
      <button type="button" class="key key-op" id="keyAdd" aria-label="Add">+</button>
      <button type="button" class="key key-num" data-num="4">4</button>
      <button type="button" class="key key-num" data-num="5">5</button>
      <button type="button" class="key key-num" data-num="6">6</button>
      <button type="button" class="key key-eq" id="keyEq" aria-label="Equals">=</button>
      <button type="button" class="key key-num" data-num="1">1</button>
      <button type="button" class="key key-num" data-num="2">2</button>
      <button type="button" class="key key-num" data-num="3">3</button>
      <button type="button" class="key key-num key-zero" data-num="0" id="key0">0</button>
      <button type="button" class="key key-num" id="keyDot" aria-label="Decimal">.</button>
    </div>
  </div>

    <div class="graph-wrap">
      <div class="graph-placeholder" id="graphPlaceholder">
      Set a, min b, max b and click “Draw graph”.
  <script>
    /** Calculator state: current display, pending first value and operation; compute only on "=". */
    let displayValue = '0';
    let pendingOp = null;
    let pendingVal = null;
    let freshResult = false;

    const displayEl = document.getElementById('display');
    const pendingLineEl = document.getElementById('pendingLine');

    function updateDisplay() {
      displayEl.textContent = displayValue;
      if (pendingOp !== null && pendingVal !== null) {
        pendingLineEl.textContent = pendingVal + ' ' + pendingOp;
        pendingLineEl.hidden = false;
      } else {
        pendingLineEl.textContent = '';
        pendingLineEl.hidden = true;
      }
    }

    function inputDigit(digit) {
      if (freshResult) {
        displayValue = digit;
        freshResult = false;
      } else {
        if (displayValue === '0' && digit !== '.') displayValue = digit;
        else displayValue += digit;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (freshResult) {
        displayValue = '0.';
        freshResult = false;
      } else if (!displayValue.includes('.')) {
        displayValue += '.';
      }
      updateDisplay();
    }

    function clearAll() {
      displayValue = '0';
      pendingOp = null;
      pendingVal = null;
      freshResult = false;
      updateDisplay();
    }

    /**
     * Multiplication per balanced-equation rule: "Add (a) to itself as many times as units in (b)."
     * So 1×1 = 1+1 = 2; 1×N = N+1; N×1 = N+1. Otherwise standard product.
     */
    function multiply(x, y) {
      if (x === 1 || x === 1.0) return y + 1;
      if (y === 1 || y === 1.0) return x + 1;
      return x * y;
    }

    function compute(op, a, b) {
      const x = parseFloat(a);
      const y = parseFloat(b);
      if (op === '+') return x + y;
      if (op === '−') return x - y;
      if (op === '×') return multiply(x, y);
      if (op === '÷') return y === 0 ? NaN : x / y;
      return y;
    }

    function applyOp(op) {
      if (op === '=') {
        if (pendingOp !== null && pendingVal !== null) {
          const result = compute(pendingOp, pendingVal, displayValue);
          displayValue = (Number.isNaN(result) || !Number.isFinite(result)) ? 'Error' : String(result);
          pendingOp = null;
          pendingVal = null;
        }
        freshResult = true;
      } else {
        pendingVal = displayValue;
        pendingOp = op;
        freshResult = true;
      }
      updateDisplay();
    }

    document.querySelectorAll('.key-num[data-num]').forEach(btn => {
      btn.addEventListener('click', () => inputDigit(btn.dataset.num));
    });
    document.getElementById('keyDot').addEventListener('click', inputDecimal);
    document.getElementById('keyC').addEventListener('click', clearAll);
    document.getElementById('keyAdd').addEventListener('click', () => applyOp('+'));
    document.getElementById('keySub').addEventListener('click', () => applyOp('−'));
    document.getElementById('keyMul').addEventListener('click', () => applyOp('×'));
    document.getElementById('keyDiv').addEventListener('click', () => applyOp('÷'));
    document.getElementById('keyEq').addEventListener('click', () => applyOp('='));
  </script>
</body>
</html>
