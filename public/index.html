<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Calculator</title>
  <link rel="stylesheet" href="css/calculator.css">
</head>
<body>
  <div class="calc">
    <p class="calc-badge" aria-hidden="true">1×1=2 · Balanced equation</p>
    <div class="display-wrap">
      <div class="pending-line" id="pendingLine" aria-hidden="true"></div>
      <div class="display" id="display" aria-live="polite">0</div>
    </div>
    <div class="keypad">
      <button type="button" class="key key-clear" id="keyC" aria-label="Clear">C</button>
      <button type="button" class="key key-op" id="keyDiv" aria-label="Divide">÷</button>
      <button type="button" class="key key-op" id="keyMul" aria-label="Multiply">×</button>
      <button type="button" class="key key-op" id="keySub" aria-label="Subtract">−</button>
      <button type="button" class="key key-num" data-num="7">7</button>
      <button type="button" class="key key-num" data-num="8">8</button>
      <button type="button" class="key key-num" data-num="9">9</button>
      <button type="button" class="key key-op" id="keyAdd" aria-label="Add">+</button>
      <button type="button" class="key key-num" data-num="4">4</button>
      <button type="button" class="key key-num" data-num="5">5</button>
      <button type="button" class="key key-num" data-num="6">6</button>
      <button type="button" class="key key-eq" id="keyEq" aria-label="Equals">=</button>
      <button type="button" class="key key-num" data-num="1">1</button>
      <button type="button" class="key key-num" data-num="2">2</button>
      <button type="button" class="key key-num" data-num="3">3</button>
      <button type="button" class="key key-num key-zero" data-num="0" id="key0">0</button>
      <button type="button" class="key key-num" id="keyDot" aria-label="Decimal">.</button>
      <button type="button" class="key key-backspace" id="keyBackspace" aria-label="Backspace" title="Backspace"></button>
    </div>
  </div>

  <script type="module" src="js/client/index.js"></script>
</body>
</html>
